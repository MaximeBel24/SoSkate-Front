<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">SoSkate</h1>
      <p class="login-subtitle">Espace administration</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" formControlName="email" id="email" placeholder="admin@soskate.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input class="form-input" type="password" formControlName="password" id="password" placeholder="Mot de passe">
      </div>
      @if (errorMessage()) {
        <div class="login-error">
          <span>{{ errorMessage() }}</span>
        </div>
      }
      <button class="btn btn-premium login-btn" type="submit" [disabled]="isLoading()">
        @if (isLoading()) { Connexion... } @else { Se connecter }
      </button>
    </form>
  </div>
</div>
